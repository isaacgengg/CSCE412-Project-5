<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Isaac Geng</title>
  <meta name="description" content="Contact Isaac Geng.">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/index.html">Isaac Geng</a>
      <nav class="nav" aria-label="Main">
        <button class="icon-btn menu-btn" aria-expanded="false" aria-controls="nav-links">Menu</button>
        <ul id="nav-links">
        <li><a href="/index.html">Home</a></li>
        <li><a href="/about.html">About</a></li>
        <li><a href="/projects.html">Projects</a></li>
        <li><a href="/resume.html">Resume</a></li>
        <li><a href="/contact.html" aria-current="page">Contact</a></li>
        </ul>
        <button class="icon-btn" data-theme-toggle aria-pressed="false">Dark mode</button>
      </nav>
    </div>
  </header>
  <main id="main">
    <section class="page-head">
      <div class="wrap">
        <h1>Contact</h1>
        <p class="lede">Questions about a project, or want to work together? Send a note and it will open in your email app.</p>
      </div>
    </section>
    <section class="section">
      <div class="wrap">
        <form id="contact-form" class="form" novalidate>
          <div class="field"><label for="name">Name</label><input id="name" name="name" autocomplete="name" aria-describedby="name-error"><p class="error" id="name-error"></p></div>
          <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" aria-describedby="email-error"><p class="error" id="email-error"></p></div>
          <div class="field"><label for="message">Message</label><textarea id="message" name="message" aria-describedby="message-error"></textarea><p class="error" id="message-error"></p></div>
          <div><button class="btn btn-primary" type="submit">Send message</button></div>
          <p class="status" role="status"></p>
        </form>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <span>&copy; <span data-year></span> Isaac Geng</span>
      <span>Served from Amazon S3 through CloudFront</span>
    </div>
  </footer>
  <script src="/js/main.js" defer></script>
</body>
</html>
