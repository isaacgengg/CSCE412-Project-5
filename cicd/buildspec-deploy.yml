# Stage 3: Deploy. Primary input = SourceArtifact (code), secondary = BuildArtifact (the tested
# site). Uploads releases/<sha>/, switches CloudFront OriginPath, waits, invalidates, records.
version: 0.2
env:
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install -q -r requirements-ci.txt
  build:
    commands:
      - python -m cicd.release deploy --artifact "$CODEBUILD_SRC_DIR_BuildArtifact"
