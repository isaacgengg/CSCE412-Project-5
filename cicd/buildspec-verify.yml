# Stage 4: Verify & Recover. Live checks against production; on failure, bounded rollback to
# the newest verified release, re-verify, and exit non-zero so the execution shows Failed.
version: 0.2
env:
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
phases:
  install:
    runtime-versions:
      python: 3.12
      nodejs: 20
    commands:
      - pip install -q -r requirements-ci.txt
      - npm ci --no-audit --no-fund
  build:
    commands:
      - python -m cicd.release verify-or-rollback --artifact "$CODEBUILD_SRC_DIR_BuildArtifact"
reports:
  arn:aws:codebuild:us-east-2:408588283693:report-group/csce412-site-tests:
    base-directory: build/results
    files: ["junit-*.xml"]
    file-format: JUNITXML
